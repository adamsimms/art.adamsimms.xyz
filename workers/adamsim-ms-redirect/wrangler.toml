# Proxied hostnames for adamsim.ms (Squarespace → art cutover).
# Bare host routes are required — `host/*` does not match `/`.
routes = [
  { pattern = "adamsim.ms", zone_name = "adamsim.ms" },
  { pattern = "adamsim.ms/*", zone_name = "adamsim.ms" },
  { pattern = "www.adamsim.ms", zone_name = "adamsim.ms" },
  { pattern = "www.adamsim.ms/*", zone_name = "adamsim.ms" },
]
